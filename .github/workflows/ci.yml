# Runs on every push and pull request: tests, security scans and a full build
# (including the built exe's self-test). Nothing is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # stops at the first failing command

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install pinned, hash-verified dependencies
        run: >
          python -m pip install --require-hashes --no-deps
          -r requirements.txt -r requirements-build.txt -r requirements-test.txt

      - name: Tests - encryption, zip workflow, naming, logging
        run: python tests/test_crypto.py

      - name: Tests - no network access
        run: python tests/test_no_network.py

      - name: Security scans (known vulnerabilities, static analysis)
        run: |
          python -m pip install pip-audit==2.10.1 bandit==1.9.4
          python -m pip_audit --strict --require-hashes --disable-pip -r requirements.txt
          python -m bandit -r . -x ./tests,./scripts,./build,./dist -ll

      - name: Build and self-test the exe
        run: python scripts/build.py

      - name: Upload build (for inspection only, not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FileLocker-ci-build
          path: release/
          retention-days: 7
